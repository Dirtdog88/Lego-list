# Cloudflare Worker config for the Lego list. See 2026-11-06-setup-guide.md for the one-time setup.
name = "lego-list"
main = "src/2026-11-06-index.js"
compatibility_date = "2026-09-01"
# Only the real address: the workers.dev one would be a second door with no Access app on it.
workers_dev = false
routes = [{ pattern = "lego.dirtdogcollective.com", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
# The worker sees every request first, so /admin is checked before any file is served.
run_worker_first = true
# Serve files at exactly their names (no .html stripping redirects).
html_handling = "none"

# The database "lego-list" (created 2026-11-06, setup guide step 2).
[[d1_databases]]
binding = "DB"
database_name = "lego-list"
database_id = "621ae786-92d6-48e6-809f-8770af2960fb"
migrations_dir = "migrations"

[observability]
enabled = true

[vars]
# Cloudflare Access for /admin: the same team as DogHaus; the AUD tag comes from the Lego list's
# own Access application (setup guide step 5).
ACCESS_TEAM_DOMAIN = "restless-fire-82ff.cloudflareaccess.com"
ACCESS_AUD = "285af93edf3c5da1034b3be32b8a5b67ca7a6f3d66e6b09984a4a6a778069b3f"
# Turnstile's site key is public (it goes to the browser). Empty = claiming is switched off.
TURNSTILE_SITE_KEY = "0x4AAAAAAF2xgiyGa1k_KF1X"

# Secrets, set in Cloudflare (never committed):
#   ADMIN_EMAILS       who may use /admin, comma-separated
#   TURNSTILE_SECRET   the Turnstile widget's secret key
#   REBRICKABLE_KEY    the Rebrickable API key (set lookups)
